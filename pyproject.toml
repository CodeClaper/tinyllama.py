[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyllama.py"
version = "0.1.0"
description = "A lightweight and fast inference engine based on vLLM with an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CodeClaper" }]
keywords = ["llm", "inference", "vllm", "openai", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "torch",
    "loguru",
    "transformers",
]

[project.urls]
Homepage = "https://github.com/CodeClaper/tinyllama.py"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests", "tests.*"]
